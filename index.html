<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock Baterias</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#111;font-size:17px}
.header,.section{max-width:600px;margin:0 auto}
.logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.header{display:flex;align-items:center;gap:10px;padding:1rem}
.h1{font-size:18px;font-weight:600}.h2{font-size:13px;color:#888;margin-top:1px}
.section{padding:1rem}.grid{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;display:flex;align-items:center;gap:16px;cursor:pointer;width:100%;text-align:left}
.icon{width:52px;height:52px;border-radius:10px;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.icon.green{background:#dcfce7}.icon.orange{background:#fff7ed}.icon.red{background:#fee2e2}
.ci{flex:1}.ci h2{font-size:19px;font-weight:700}.ci p{font-size:14px;color:#888;margin-top:2px}
.arr{font-size:24px;color:#ccc}
.mstat{text-align:right;flex-shrink:0;margin-right:8px}.mtot{font-size:28px;font-weight:700}.mlab{font-size:12px;color:#aaa}
.back{display:flex;align-items:center;gap:8px;background:none;border:none;font-size:16px;color:#555;cursor:pointer;padding:0 0 1rem 0;font-weight:500}
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.sbox input{background:transparent;border:none;outline:none;font-size:16px;width:100%}
.mc{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;margin-bottom:10px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.mn{font-size:18px;font-weight:600;line-height:1.3}
.badge{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;margin-left:8px}
.ok{background:#dcfce7;color:#166534}.low{background:#fef9c3;color:#854d0e}.out{background:#fee2e2;color:#991b1b}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sn{font-size:44px;font-weight:700}.sl{font-size:14px;color:#888;line-height:1.4}
.acts{display:flex;gap:8px}
.bp{flex:1;background:#111;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.bp:disabled{opacity:.3;cursor:not-allowed}
.bs{background:transparent;border:1px solid #ddd;border-radius:10px;padding:14px 16px;font-size:16px;cursor:pointer;color:#444}
.rp{display:none;background:#f5f5f5;border-radius:10px;padding:1rem;margin-top:10px}
.rp.open{display:block}
.qr{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.qb{width:42px;height:42px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:22px;cursor:pointer}
.qv{font-size:26px;font-weight:700;flex:1;text-align:center}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1}
.loading{text-align:center;padding:3rem;color:#888;font-size:16px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:12px 16px;font-size:15px;margin-bottom:12px}
.hidden{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable th{background:#111;color:#fff;padding:10px 8px;text-align:left;position:sticky;top:0}
.ptable td{padding:10px 8px;border-bottom:1px solid #f0f0f0;background:#fff}
.ptable tr:nth-child(even) td{background:#f9f9f9}
.pventa{font-weight:700;color:#166534}
.pnoche{font-weight:700;color:#7c3aed}
.stk-info{font-size:12px;margin-top:3px}
.stk-ok{color:#166534}.stk-no{color:#991b1b}
.ptabs{display:flex;gap:4px;margin-bottom:12px;background:#e5e5e5;padding:4px;border-radius:10px;overflow-x:auto}
.ptab{flex:1;text-align:center;padding:9px;font-size:14px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:#666;white-space:nowrap}
.ptab.active{background:#fff;color:#111;font-weight:600}
.twrap{border-radius:14px;overflow:hidden;border:1px solid #e5e5e5;overflow-x:auto}
.bres{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1rem;margin-bottom:10px}
.bres-v{font-size:16px;font-weight:700;margin-bottom:4px}
.bres-b{font-size:14px;color:#444}
.no-res{text-align:center;padding:2rem;color:#aaa;font-size:15px}
.gform{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;margin-bottom:16px}
.gfield{margin-bottom:12px}
.gfield label{display:block;font-size:13px;font-weight:600;color:#888;margin-bottom:4px;text-transform:uppercase}
.gfield input{width:100%;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;padding:12px;font-size:16px;outline:none}
.gfield input:focus{border-color:#111;background:#fff}
.gcard{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.25rem;margin-bottom:10px}
.gcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.gcard-titulo{font-size:17px;font-weight:700}
.gcard-dias{font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px}
.dias-ok{background:#dcfce7;color:#166534}
.dias-warn{background:#fef9c3;color:#854d0e}
.dias-late{background:#fee2e2;color:#991b1b}
.gcard-row{font-size:14px;color:#555;margin-top:3px}
.gcard-row span{font-weight:600;color:#111}
.gtabs{display:flex;gap:4px;margin-bottom:12px;background:#e5e5e5;padding:4px;border-radius:10px}
.gtab{flex:1;text-align:center;padding:9px;font-size:14px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:#666}
.gtab.active{background:#fff;color:#111;font-weight:600}
.col-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.col-overlay.hidden{display:none}
.tmini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #f0f0f0}
.tmini:last-child{border-bottom:none}
.tmini-left{display:flex;align-items:center;gap:12px;min-width:0}
.tmini-time{font-size:17px;font-weight:800;min-width:48px;flex-shrink:0}
.tmini-info{font-size:14px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmini-info b{color:#111}
.tmini-tag{font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}
.tmini-tag.late{color:#991b1b}
.tmini-tag.urgent{color:#dc2626}
.tmini-tag.today{color:#c2410c}
.tmini-tag.future{color:#999;font-weight:600}
.tmini-actions{display:flex;gap:6px;flex-shrink:0}
.tmini-x{width:26px;height:26px;border-radius:7px;border:1px solid #e5e5e5;background:#fff;color:#888;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tmini-ok{width:26px;height:26px;border-radius:7px;border:none;background:#111;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>

function diasDesde(fecha){
  if(!fecha)return null;
  var d=new Date(fecha);
  if(isNaN(d))return null;
  return Math.floor((new Date()-d)/(1000*60*60*24));
}
function cargarGarantias(){
  document.getElementById('listaGarantias').innerHTML='<div class="loading">Cargando...</div>';
  api('getGarantias').then(function(r){
    if(!r||!r.ok||!r.data||!r.data.length){document.getElementById('listaGarantias').innerHTML='<div class="no-res">No hay garantias registradas</div>';return;}
    var h='';
    var listaOrdenada=r.data.slice().sort(function(a,b){
      var pa=a.resuelto==='RESUELTO'?1:0;
      var pb=b.resuelto==='RESUELTO'?1:0;
      return pa-pb;
    });
    listaOrdenada.forEach(function(g){
      var dias=diasDesde(g.fecha_ingreso);
      var dcls=g.resuelto==='RESUELTO'?'dias-ok':dias===null?'dias-ok':dias>30?'dias-late':dias>15?'dias-warn':'dias-ok';
      var dtxt=g.resuelto==='RESUELTO'?'Completado':dias===null?'-':dias+' dias';
      h+='<div class="gcard">';
      h+='<div class="gcard-top"><div class="gcard-titulo">'+g.garantia+'</div><span class="gcard-dias '+dcls+'">'+dtxt+'</span></div>';
      h+='<div class="gcard-row">Auto: <span>'+g.auto+'</span></div>';
      h+='<div class="gcard-row">Motivo: <span>'+g.motivo+'</span></div>';
      h+='<div class="gcard-row">Ingreso: <span>'+g.fecha_ingreso+'</span></div>';
      if(g.fecha_devolucion)h+='<div class="gcard-row">Devolucion: <span>'+g.fecha_devolucion+'</span></div>';
      if(g.distribuidor)h+='<div class="gcard-row">Distribuidor: <span>'+g.distribuidor+'</span></div>';
      var resColor=g.resuelto==='RESUELTO'?'#166534':g.resuelto==='NO RESUELTO'?'#991b1b':'#888';
      h+='<div class="gcard-row" style="margin-top:8px">Estado: <select onchange="cambiarEstadoGarantia(\''+g.id+'\',this.value)" style="margin-left:6px;padding:4px 8px;border-radius:8px;border:1px solid #ddd;font-size:13px;font-weight:600;color:'+resColor+'">';
      h+='<option value=""'+((!g.resuelto||g.resuelto=='')?'selected':'')+'>— Sin estado —</option>';
      h+='<option value="RESUELTO"'+(g.resuelto==='RESUELTO'?'selected':'')+'>RESUELTO</option>';
      h+='<option value="NO RESUELTO"'+(g.resuelto==='NO RESUELTO'?'selected':'')+'>NO RESUELTO</option>';
      h+='</select></div>';
      h+='</div>';
    });
    document.getElementById('listaGarantias').innerHTML=h;
  }).catch(function(e){
    document.getElementById('listaGarantias').innerHTML='<div class="err">Error al cargar: '+e.message+'</div>';
  });
}

function cargar(){
  sync('Sincronizando...');
  api('getDatos').then(function(r){
    if(r.ok){
      datos=r.data.map(function(d){
        d.stock_emi=parseInt(d.stock_emi)||0;
        d.stock_mario=parseInt(d.stock_mario)||0;
        d.stock_mateo=parseInt(d.stock_mateo)||0;
        d.stock_deposito=parseInt(d.stock_deposito)||0;
        return d;
      });
      sync('Sincronizado');
      document.getElementById('p0load').classList.add('hidden');
      document.getElementById('p0').classList.remove('hidden');
    }else{errLoad('Error al leer.');}
  }).catch(function(e){errLoad(e.message);});
}

var confirmandoColocacion=false;
function confirmarColocacion(){
  if(confirmandoColocacion)return;
  var m=datos.filter(function(x){return x.id===colId;})[0];
  if(!m){toast('Error: bateria no encontrada');return;}
  if(m[cam.c]===0){toast('Sin stock disponible');return;}
  var fecha=document.getElementById('colFecha').value||hoyStr();
  var vehiculo=document.getElementById('colVehiculo').value.trim();
  var anio=document.getElementById('colAnio').value.trim();
  var motor=document.getElementById('colMotor').value.trim();
  var combustible=document.getElementById('colCombustible').value.trim();
  var precio=document.getElementById('colPrecio').value.trim();
  if(!vehiculo){toast('Completa el vehiculo');return;}
  if(!anio){toast('Completa el anio del vehiculo');return;}
  if(!motor){toast('Completa el motor');return;}
  if(!combustible){toast('Completa el combustible');return;}
  if(!precio){toast('Completa el precio');return;}
  if(!colPago){toast('Elegi la forma de pago');return;}
  if(!colUbi){toast('Elegi la ubicacion');return;}
  var nuevoStock=m[cam.c]-1;
  confirmandoColocacion=true;
  var btnConfirmar=document.querySelector('#colOverlay .bp');
  if(btnConfirmar){btnConfirmar.disabled=true;btnConfirmar.textContent='Guardando...';}
  sync('Guardando...');
  api('registrarColocacion',{
    id:colId,campo:cam.c,valor:nuevoStock,
    fecha:fecha,
    vehiculo:vehiculo,
    anio_vehiculo:anio,
    motor:motor,
    combustible:combustible,
    modelo_bateria:m.codigo||m.nombre,
    precio:precio,
    forma_pago:colPago,

function mostrarResumen(){
  document.getElementById('p0').classList.add('hidden');
  document.getElementById('p7').classList.remove('hidden');
  titulo('Resumen');
  document.getElementById('historialBody').innerHTML='<tr><td colspan="11" class="loading">Cargando...</td></tr>';
  document.getElementById('resumenBody').innerHTML='<div class="loading">Cargando...</div>';
  cargarTurnos();
  api('getHistorial').then(function(r){
    if(!r.ok){document.getElementById('historialBody').innerHTML='<tr><td colspan="11" class="err">Error al cargar</td></tr>';return;}
    if(!r.data.length){document.getElementById('historialBody').innerHTML='<tr><td colspan="11" class="no-res">Sin servicios este mes</td></tr>';return;}
    var h='';
    var grupos={};
    var ordenFechas=[];
    r.data.forEach(function(s){
      if(!grupos[s.fecha]){grupos[s.fecha]=[];ordenFechas.push(s.fecha);}
      grupos[s.fecha].push(s);
    });
    ordenFechas.sort(function(a,b){return a<b?1:a>b?-1:0;});
    var ordenTecnico={'Emi':0,'Mario':1,'Mateo':2};
    function ordenarPorTecnico(lista){
      lista.forEach(function(s,idx){s._idx=idx;});
      lista.sort(function(a,b){
        var oa=ordenTecnico.hasOwnProperty(a.tecnico)?ordenTecnico[a.tecnico]:99;
        var ob=ordenTecnico.hasOwnProperty(b.tecnico)?ordenTecnico[b.tecnico]:99;
        if(oa!==ob)return oa-ob;
        return a._idx-b._idx;
      });
    }
    var hoy=hoyStr();
    ordenFechas.forEach(function(fecha){
      var lista=grupos[fecha];
      ordenarPorTecnico(lista);
      if(fecha===hoy){
        lista.forEach(function(s){h+=filaServicio(s);});
      }else{
        var gid='sum-'+fecha.replace(/-/g,'');
        var extrasLista=lista.filter(function(s){return s.modelo_bateria==='Arranque'||s.modelo_bateria==='Carga de bateria';});
        var colocLista=lista.length-extrasLista.length;
        var arrLista=lista.filter(function(s){return s.modelo_bateria==='Arranque';}).length;
        var cargLista=lista.filter(function(s){return s.modelo_bateria==='Carga de bateria';}).length;
        var etiquetaDia=colocLista+' servicio'+(colocLista===1?'':'s');
        var extrasTxtDia=[];
        if(arrLista)extrasTxtDia.push(arrLista+' arranque'+(arrLista===1?'':'s'));
        if(cargLista)extrasTxtDia.push(cargLista+' carga'+(cargLista===1?'':'s'));
        if(extrasTxtDia.length)etiquetaDia+=' - '+extrasTxtDia.join(', ');
        h+='<tr class="dia-summary" style="cursor:pointer" onclick="toggleDia(\''+gid+'\')"><td colspan="11" style="padding:14px 8px;background:#991b1b"><span style="display:flex;align-items:center;gap:10px"><span id="'+gid+'-icon" style="color:#fff;font-size:13px">&#9656;</span><span style="color:#fff;font-weight:700;font-size:15px">'+fmtFecha(fecha)+'</span><span style="background:#fff;color:#991b1b;font-weight:800;font-size:14px;padding:3px 12px;border-radius:99px;margin-left:auto">'+etiquetaDia+'</span></span></td></tr>';
        lista.forEach(function(s){h+=filaServicio(s,gid);});
      }
    });
    document.getElementById('historialBody').innerHTML=h;
  }).catch(function(e){document.getElementById('historialBody').innerHTML='<tr><td colspan="11" class="err">Error: '+e.message+'</td></tr>';});
  api('getResumen').then(function(r){
    if(!r.ok){document.getElementById('resumenBody').innerHTML='<div class="err">Error al cargar</div>';return;}
    var extraTxt=[];
    if(r.hoyArranque)extraTxt.push(r.hoyArranque+' arranque'+(r.hoyArranque===1?'':'s'));
    if(r.hoyCarga)extraTxt.push(r.hoyCarga+' carga'+(r.hoyCarga===1?'':'s')+' de bateria');
    var extraHtml=extraTxt.length?'<div style="font-size:12px;color:#c2410c;font-weight:600;margin-top:4px">- '+extraTxt.join(', ')+'</div>':'';
    var extraTxt30=[];
    if(r.semanaArranque)extraTxt30.push(r.semanaArranque+' arranque'+(r.semanaArranque===1?'':'s'));
    if(r.semanaCarga)extraTxt30.push(r.semanaCarga+' carga'+(r.semanaCarga===1?'':'s')+' de bateria');
    var extraHtml30=extraTxt30.length?'<div style="font-size:12px;color:#c2410c;font-weight:600;margin-top:4px">- '+extraTxt30.join(', ')+'</div>':'';
    var h='';
    h+='<div style="display:flex;gap:12px;margin-bottom:16px">';
    h+='<div class="mc" style="flex:1;text-align:center"><div style="font-size:13px;color:#888;margin-bottom:6px">HOY</div><div style="font-size:36px;font-weight:700">'+r.hoy+'</div><div style="font-size:12px;color:#888">servicios</div>'+extraHtml+'</div>';
    h+='<div class="mc" style="flex:1;text-align:center"><div style="font-size:13px;color:#888;margin-bottom:6px">ULTIMOS 30 DIAS</div><div style="font-size:36px;font-weight:700">'+r.semana+'</div><div style="font-size:12px;color:#888">servicios</div>'+extraHtml30+'</div>';
    h+='</div>';
    h+='<div style="display:flex;gap:12px;margin-bottom:16px">';
    h+='<div class="mc" style="flex:1;text-align:center"><div style="font-size:13px;color:#888;margin-bottom:6px">SCRAP 10 DIAS</div><div style="font-size:36px;font-weight:700;color:#7c3aed">'+r.scrap10+'</div><div style="font-size:12px;color:#888">baterias recibidas</div></div>';
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por tecnico (30 dias)</div>';
    Object.keys(r.porTecnico).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porTecnico[k]+'</span></div>';});
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por marca (30 dias)</div>';
    Object.keys(r.porMarca).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porMarca[k]+'</span></div>';});
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por modelo (30 dias)</div>';
    var ordenMarca={'MOURA':0,'WILLARD':1,'SERMAT':2,'HERBO':3,'BARI':4};
    var modelosOrdenados=Object.keys(r.porModelo).sort(function(ka,kb){
      var ma=((r.modeloMarca&&r.modeloMarca[ka])||'').toUpperCase();
      var mb=((r.modeloMarca&&r.modeloMarca[kb])||'').toUpperCase();
      var oa=ordenMarca.hasOwnProperty(ma)?ordenMarca[ma]:99;
      var ob=ordenMarca.hasOwnProperty(mb)?ordenMarca[mb]:99;
      if(oa!==ob)return oa-ob;
      if(ma!==mb)return ma<mb?-1:1;
      return ka<kb?-1:ka>kb?1:0;
    });
    modelosOrdenados.forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porModelo[k]+'</span></div>';});
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por forma de pago (30 dias)</div>';
    Object.keys(r.porPago).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porPago[k]+'</span> — <span>$'+formatMoney(r.porPagoMonto&&r.porPagoMonto[k]||0)+'</span></div>';});
    h+='</div>';
    document.getElementById('resumenBody').innerHTML=h;
  }).catch(function(e){document.getElementById('resumenBody').innerHTML='<div class="err">Error: '+e.message+'</div>';});
}
function hoyStr(){var d=new Date();var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,'0');var day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function formatMoney(v){var n=parseFloat(String(v||'').replace(/[^0-9.-]/g,''))||0;return n.toLocaleString('es-AR',{maximumFractionDigits:0});}
function safeVal(v){if(!v)return '';if(/^\d{4}-\d{2}-\d{2}T/.test(v))return '';return v;}
function fmtFecha(f){var p=f.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:f;}
function filaServicio(s,hiddenClass){
  var pagado=s.estado_pago==='Pagado';
  var esExtra=s.modelo_bateria==='Arranque'||s.modelo_bateria==='Carga de bateria';
  var esTarjeta=s.forma_pago==='Tarjeta';
  var rowBg=esExtra?'#fff7ed':(esTarjeta?'#eff6ff':'');
  var styleParts=[];
  if(!pagado)styleParts.push('font-weight:700');
  if(hiddenClass)styleParts.push('display:none');
  var styleAttr=styleParts.length?' style="'+styleParts.join(';')+'"':'';
  var clsAttr=hiddenClass?' class="'+hiddenClass+'"':'';
  var td=rowBg?'<td style="background:'+rowBg+'">':'<td>';
  var bg=pagado?'#dcfce7':'#fee2e2';
  var col=pagado?'#166534':'#991b1b';
  var label=pagado?'PAGADO':'NO PAGADO';
  return '<tr'+clsAttr+styleAttr+'>'+td+fmtFecha(s.fecha)+'</td>'+td+s.vehiculo+'</td>'+td+(s.anio_vehiculo||'')+'</td>'+td+safeVal(s.motor)+'</td>'+td+s.combustible+'</td>'+td+s.modelo_bateria+'</td>'+td+'$'+formatMoney(s.precio)+'</td>'+td+s.forma_pago+'</td>'+td+s.ubicacion+'</td>'+td+s.tecnico+'</td>'+td+'<button style="background:'+bg+';color:'+col+';border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer" onclick="togglePago('+s.fila+',\''+s.estado_pago+'\',this)">'+label+'</button></td></tr>';
}
function toggleDia(id){
  var filas=document.querySelectorAll('.'+id);
  var icon=document.getElementById(id+'-icon');
  var visible=filas.length && filas[0].style.display!=='none';
  filas.forEach(function(f){f.style.display=visible?'none':'table-row';});
  if(icon)icon.innerHTML=visible?'&#9656;':'&#9662;';
}
function togglePago(fila,estadoActual,btn){
  var nuevo=estadoActual==='Pagado'?'No pagado':'Pagado';
  btn.disabled=true;
  api('actualizarPago',{fila:fila,estado:nuevo}).then(function(r){
    btn.disabled=false;
    if(r.ok){
      var pagado=nuevo==='Pagado';
      btn.textContent=pagado?'PAGADO':'NO PAGADO';
      btn.style.background=pagado?'#dcfce7':'#fee2e2';
      btn.style.color=pagado?'#166534':'#991b1b';
      btn.setAttribute('onclick',"togglePago("+fila+",'"+nuevo+"',this)");
      btn.closest('tr').style.fontWeight=pagado?'':'700';
      toast(pagado?'Marcado como pagado':'Marcado como no pagado');
    }else{toast('Error al actualizar');}
  }).catch(function(e){btn.disabled=false;toast('Error: '+e.message);});
}

var turnos=[],turnoTecnico='';

function dateStr(d){var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,'0');var day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}

function cargarTurnos(){
  var el=document.getElementById('turnosMini');
  if(el)el.innerHTML='<div class="loading" style="padding:1rem">Cargando...</div>';
  api('getTurnos').then(function(r){
    if(!r.ok){if(el)el.innerHTML='<div class="err">Error al cargar</div>';return;}
    turnos=r.data||[];
    renderTurnosMini();
  }).catch(function(e){if(el)el.innerHTML='<div class="err">Error: '+e.message+'</div>';});
}

function renderTurnosMini(){
  var el=document.getElementById('turnosMini');
  if(!el)return;
  var activos=turnos.filter(function(t){return t.estado!=='Completado'&&t.estado!=='Cancelado';});
  activos.sort(function(a,b){
    var da=a.fecha+' '+(a.hora||'00:00');
    var db=b.fecha+' '+(b.hora||'00:00');
    return da<db?-1:da>db?1:0;
  });
  if(!activos.length){el.innerHTML='<div style="padding:.75rem 2px;color:#aaa;font-size:14px">No hay turnos agendados</div>';return;}
  var ahora=new Date();
  var hoyS=hoyStr();
  var mananaD=new Date();mananaD.setDate(mananaD.getDate()+1);
  var mananaS=dateStr(mananaD);
  var h='';
  activos.forEach(function(t){
    var esHoy=t.fecha===hoyS;
    var esManana=t.fecha===mananaS;
    var dt=new Date(t.fecha+'T'+(t.hora||'00:00')+':00');
    var diffMin=(dt-ahora)/60000;
    var cls,relTxt;
    if(diffMin<0){cls='late';relTxt='ATRASADO';}
    else if(diffMin<=60){cls='urgent';relTxt='EN '+Math.max(0,Math.round(diffMin))+' MIN';}
    else if(esHoy){cls='today';relTxt='HOY';}
    else{cls='future';relTxt=esManana?'MAÑANA':fmtFecha(t.fecha);}
    var infoParts=[];
    if(t.vehiculo)infoParts.push('<b>'+t.vehiculo+'</b>');
    if(t.cliente)infoParts.push(t.cliente);
    if(t.direccion)infoParts.push(t.direccion);
    if(t.precio)infoParts.push('<b style="color:#166534">$'+formatMoney(t.precio)+'</b>');
    var infoTxt=infoParts.join(' · ')||'-';
    h+='<div class="tmini">';
    h+='<div class="tmini-left"><div class="tmini-time">'+(t.hora||'--:--')+'</div><div class="tmini-info">'+infoTxt+'</div></div>';
    h+='<div class="tmini-actions"><span class="tmini-tag '+cls+'">'+relTxt+'</span><button class="tmini-ok" title="Completado" onclick="completarTurno(\''+t.id+'\')">&#10003;</button><button class="tmini-x" title="Cancelar" onclick="cancelarTurno(\''+t.id+'\')">&#10005;</button></div>';
    h+='</div>';
  });
  el.innerHTML=h;
  actualizarAlertaReservados();
}

function actualizarAlertaReservados(){
  var sub=document.getElementById('resumenSub');
  if(!sub)return;
  var hayActivos=turnos.some(function(t){return t.estado!=='Completado'&&t.estado!=='Cancelado';});
  if(hayActivos){
    sub.innerHTML='&#9888; HAY SERVICIOS RESERVADOS';
    sub.style.color='#c2410c';
    sub.style.fontWeight='800';
  }else{
    sub.textContent='Servicios de hoy y la semana';
    sub.style.color='';
    sub.style.fontWeight='';
  }
}

function cargarAlertaReservados(){
  api('getTurnos').then(function(r){
    if(r.ok){turnos=r.data||[];actualizarAlertaReservados();}
  }).catch(function(){});
}

var confirmandoTurno=false;
function confirmarTurno(){
  if(confirmandoTurno)return;
  var fecha=document.getElementById('tFecha').value;
  var hora=document.getElementById('tHora').value;

      cerrarTurnoOverlay();
      toast('Turno guardado');
      cargarTurnos();
    }else{toast('Error al guardar');}
  }).catch(function(e){

    if(btnT){btnT.disabled=false;btnT.textContent='Guardar turno';}
    toast('Error: '+e.message);
  });
}
