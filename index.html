<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#111;font-size:17px}
.header,.section{max-width:600px;margin:0 auto}
.logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center}

.icon{width:52px;height:52px;border-radius:10px;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.icon.green{background:#dcfce7}.icon.orange{background:#fff7ed}.icon.red{background:#fee2e2}
.ci{flex:1}.ci h2{font-size:19px;font-weight:700}.ci p{font-size:14px;color:#888;margin-top:2px}
.arr{font-size:24px;color:#ccc}
.mstat{text-align:right;flex-shrink:0;margin-right:8px}.mtot{font-size:28px;font-weight:700}.mlab{font-size:12px;color:#aaa}
.back{display:flex;align-items:center;gap:8px;background:none;border:none;font-size:16px;color:#555;cursor:pointer;padding:0 0 1rem 0;font-weight:500}
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.sbox input{background:transparent;border:none;outline:none;font-size:16px;width:100%}
.mc{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;margin-bottom:10px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.mn{font-size:18px;font-weight:600;line-height:1.3}
.badge{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;margin-left:8px}
.ok{background:#dcfce7;color:#166534}.low{background:#fef9c3;color:#854d0e}.out{background:#fee2e2;color:#991b1b}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sn{font-size:44px;font-weight:700}.sl{font-size:14px;color:#888;line-height:1.4}
.acts{display:flex;gap:8px}
.bp{flex:1;background:#111;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.bp:disabled{opacity:.3;cursor:not-allowed}
.bs{background:transparent;border:1px solid #ddd;border-radius:10px;padding:14px 16px;font-size:16px;cursor:pointer;color:#444}
.rp{display:none;background:#f5f5f5;border-radius:10px;padding:1rem;margin-top:10px}
.rp.open{display:block}
.qr{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.qb{width:42px;height:42px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:22px;cursor:pointer}
.qv{font-size:26px;font-weight:700;flex:1;text-align:center}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1}
.loading{text-align:center;padding:3rem;color:#888;font-size:16px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:12px 16px;font-size:15px;margin-bottom:12px}
.hidden{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable th{background:#111;color:#fff;padding:10px 8px;text-align:left;position:sticky;top:0}
.ptable td{padding:10px 8px;border-bottom:1px solid #f0f0f0;background:#fff}
.ptable tr:nth-child(even) td{background:#f9f9f9}
.pventa{font-weight:700;color:#166534}
.pnoche{font-weight:700;color:#7c3aed}
.stk-info{font-size:12px;margin-top:3px}
.stk-ok{color:#166534}.stk-no{color:#991b1b}
.ptabs{display:flex;gap:4px;margin-bottom:12px;background:#e5e5e5;padding:4px;border-radius:10px;overflow-x:auto}
.ptab{flex:1;text-align:center;padding:9px;font-size:14px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:#666;white-space:nowrap}
.ptab.active{background:#fff;color:#111;font-weight:600}
.twrap{border-radius:14px;overflow:hidden;border:1px solid #e5e5e5;overflow-x:auto}
.bres{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1rem;margin-bottom:10px}
.bres-v{font-size:16px;font-weight:700;margin-bottom:4px}
.bres-b{font-size:14px;color:#444}
.no-res{text-align:center;padding:2rem;color:#aaa;font-size:15px}
.gform{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;margin-bottom:16px}
.gfield{margin-bottom:12px}
.gfield label{display:block;font-size:13px;font-weight:600;color:#888;margin-bottom:4px;text-transform:uppercase}
.gfield input{width:100%;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;padding:12px;font-size:16px;outline:none}
.gfield input:focus{border-color:#111;background:#fff}
.gcard{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.25rem;margin-bottom:10px}
.gcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.gcard-titulo{font-size:17px;font-weight:700}
.gcard-dias{font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px}

.gcard-row{font-size:14px;color:#555;margin-top:3px}
.gcard-row span{font-weight:600;color:#111}
.gtabs{display:flex;gap:4px;margin-bottom:12px;background:#e5e5e5;padding:4px;border-radius:10px}
.gtab{flex:1;text-align:center;padding:9px;font-size:14px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:#666}
.gtab.active{background:#fff;color:#111;font-weight:600}
.col-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.col-overlay.hidden{display:none}

function api(action,params){
  params=params||{};
  return new Promise(function(resolve,reject){
    var cbName='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    window[cbName]=function(data){
      resolve(data);
      delete window[cbName];
      if(scriptEl.parentNode)scriptEl.parentNode.removeChild(scriptEl);
    };
    var url=API_URL+'?action='+action+'&callback='+cbName;
    Object.keys(params).forEach(function(k){url+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);});
    var scriptEl=document.createElement('script');
    scriptEl.src=url;
    scriptEl.onerror=function(){reject(new Error('Error de red'));delete window[cbName];if(scriptEl.parentNode)scriptEl.parentNode.removeChild(scriptEl);};
    document.body.appendChild(scriptEl);
  });
}

function getStockInfo(codigo){
  var m=datos.filter(function(d){return d.codigo===codigo;})[0];
  if(!m)return null;
  var parts=[];
  CAMS.forEach(function(c){var v=m[c.c]||0;if(v>0)parts.push(c.n+': '+v);});
  return {total:parts.length,txt:parts.length===0?'Sin stock':parts.join(' | ')};
}
function mostrarStock(){document.getElementById('p0').classList.add('hidden');document.getElementById('p1').classList.remove('hidden');rCams();}

function mostrarBuscador(){

  titulo('Buscador de Baterias');

  if(BUSCADOR.length===0){
    api('getBuscador').then(function(r){
      if(r.ok){BUSCADOR=r.data;}
      document.getElementById('resV').innerHTML='<div class="no-res">Escribi el nombre del vehiculo</div>';
    });
  } else {
    document.getElementById('resV').innerHTML='<div class="no-res">Escribi el nombre del vehiculo</div>';

}

}
function cambiarTab(n){
  tabActual=n;[1,2,3,4,5].forEach(function(i){document.getElementById('tab'+i).classList.toggle('active',i===n);});
  document.getElementById('busP').value='';filtrarPrecios();
}
function cambiarGTab(n){
  gTabActual=n;[1,2].forEach(function(i){document.getElementById('gtab'+i).classList.toggle('active',i===n);});
  document.getElementById('gvista1').classList.toggle('hidden',n!==1);
  document.getElementById('gvista2').classList.toggle('hidden',n!==2);
  if(n===1)cargarGarantias();
}
function filtrarPrecios(){
  var b=document.getElementById('busP').value.toLowerCase();
  var lista=tabActual===1?PMOURA:tabActual===2?PUB:tabActual===3?PSERMAT:tabActual===4?PHERBO:PBARI;
  var h='';
  lista.filter(function(x){return x.m.toLowerCase().indexOf(b)!==-1;}).forEach(function(x){
    var si=getStockInfo(x.m);
    var stk=si?si.txt:'Sin stock';
    var cls=si&&si.total>0?'stk-ok':'stk-no';
    var pv=parseFloat(x.p.replace(/\./g,'').replace(',','.').replace('$',''))||0;
    var pn=x.p==='—'?'—':'$'+(pv+8000).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    var esEFB=x.m.indexOf('EFB')!==-1;
    var esStartStop=x.m.indexOf('72LD')!==-1;
    var badgeEFB=esEFB?'<span style="background:#dcfce7;color:#166534;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px">EFB (START STOP)</span>':'';
    var badgeSS=esStartStop?'<span style="background:#dcfce7;color:#166534;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px">EFB (START STOP)</span>':'';
    h+='<tr><td><b>'+x.m+'</b>'+badgeEFB+badgeSS+'<div class="stk-info '+cls+'">'+stk+'</div></td><td>'+x.l+'</td><td class="pventa">'+x.p+'</td><td class="pnoche">'+pn+'</td></tr>';
  });
  document.getElementById('preciosBody').innerHTML=h||'<tr><td colspan="4" style="text-align:center;padding:1rem;color:#aaa">Sin resultados</td></tr>';
}
function buscarVehiculo(){
  var b=document.getElementById('busV').value.toLowerCase().trim();
  var el=document.getElementById('resV');
  if(b.length<2){el.innerHTML='<div class="no-res">Escribi al menos 2 letras</div>';return;}
  var res=BUSCADOR.filter(function(x){return x[0].toLowerCase().indexOf(b)!==-1;});
  if(!res.length){el.innerHTML='<div class="no-res">No se encontraron resultados</div>';return;}
  var h='';
  res.forEach(function(x){h+='<div class="bres"><div class="bres-v">'+x[0]+'</div><div class="bres-b">'+x[1]+'</div></div>';});
  el.innerHTML=h;
}
function diasDesde(fecha){
  if(!fecha)return null;
  var d=new Date(fecha);
  if(isNaN(d))return null;
  return Math.floor((new Date()-d)/(1000*60*60*24));
}
function cargarGarantias(){
  document.getElementById('listaGarantias').innerHTML='<div class="loading">Cargando...</div>';
  api('getGarantias').then(function(r){
    if(!r||!r.ok||!r.data||!r.data.length){document.getElementById('listaGarantias').innerHTML='<div class="no-res">No hay garantias registradas</div>';return;}
    var h='';
    var listaOrdenada=r.data.slice().sort(function(a,b){
      var pa=a.resuelto==='RESUELTO'?1:0;
      var pb=b.resuelto==='RESUELTO'?1:0;
      return pa-pb;
    });
    listaOrdenada.forEach(function(g){
      var dias=diasDesde(g.fecha_ingreso);
      var dcls=g.resuelto==='RESUELTO'?'dias-ok':dias===null?'dias-ok':dias>30?'dias-late':dias>15?'dias-warn':'dias-ok';
      var dtxt=g.resuelto==='RESUELTO'?'Completado':dias===null?'-':dias+' dias';
      h+='<div class="gcard">';
      h+='<div class="gcard-top"><div class="gcard-titulo">'+g.garantia+'</div><span class="gcard-dias '+dcls+'">'+dtxt+'</span></div>';
      h+='<div class="gcard-row">Auto: <span>'+g.auto+'</span></div>';
      h+='<div class="gcard-row">Motivo: <span>'+g.motivo+'</span></div>';
      h+='<div class="gcard-row">Ingreso: <span>'+g.fecha_ingreso+'</span></div>';
      if(g.fecha_devolucion)h+='<div class="gcard-row">Devolucion: <span>'+g.fecha_devolucion+'</span></div>';
      if(g.distribuidor)h+='<div class="gcard-row">Distribuidor: <span>'+g.distribuidor+'</span></div>';
      var resColor=g.resuelto==='RESUELTO'?'#166534':g.resuelto==='NO RESUELTO'?'#991b1b':'#888';
      h+='<div class="gcard-row" style="margin-top:8px">Estado: <select onchange="cambiarEstadoGarantia(\''+g.id+'\',this.value)" style="margin-left:6px;padding:4px 8px;border-radius:8px;border:1px solid #ddd;font-size:13px;font-weight:600;color:'+resColor+'">';
      h+='<option value=""'+((!g.resuelto||g.resuelto=='')?'selected':'')+'>— Sin estado —</option>';
      h+='<option value="RESUELTO"'+(g.resuelto==='RESUELTO'?'selected':'')+'>RESUELTO</option>';
      h+='<option value="NO RESUELTO"'+(g.resuelto==='NO RESUELTO'?'selected':'')+'>NO RESUELTO</option>';
      h+='</select></div>';
      h+='</div>';
    });
    document.getElementById('listaGarantias').innerHTML=h;
  }).catch(function(e){
    document.getElementById('listaGarantias').innerHTML='<div class="err">Error al cargar: '+e.message+'</div>';
  });
}
function cambiarEstadoGarantia(id, valor){
  api('actualizarGarantia',{id:id,campo:'resuelto',valor:valor}).then(function(){toast('Estado actualizado');});
}
function guardarGarantiaForm(){
  var datos={
    garantia:document.getElementById('gGarantia').value.trim(),
    motivo:document.getElementById('gMotivo').value.trim(),
    auto:document.getElementById('gAuto').value.trim(),
    fecha_ingreso:document.getElementById('gFechaIngreso').value,
    fecha_devolucion:document.getElementById('gFechaDevolucion').value,
    distribuidor:document.getElementById('gDistribuidor').value.trim()
  };
  if(!datos.garantia||!datos.auto){toast('Completa Garantia y Auto');return;}
  sync('Guardando...');
  api('guardarGarantia',datos).then(function(){
    sync('Sincronizado');
    toast('Garantia guardada');
    ['gGarantia','gMotivo','gAuto','gFechaIngreso','gFechaDevolucion','gDistribuidor'].forEach(function(id){document.getElementById(id).value='';});
    cambiarGTab(1);
  }).catch(function(e){sync('Error');toast('Error: '+e.message);});
}
function cargar(){
  sync('Sincronizando...');
  api('getDatos').then(function(r){
    if(r.ok){
      datos=r.data.map(function(d){
        d.stock_emi=parseInt(d.stock_emi)||0;
        d.stock_mario=parseInt(d.stock_mario)||0;
        d.stock_mateo=parseInt(d.stock_mateo)||0;
        return d;
      });
      sync('Sincronizado');
      document.getElementById('p0load').classList.add('hidden');
      document.getElementById('p0').classList.remove('hidden');
    }else{errLoad('Error al leer.');}
  }).catch(function(e){errLoad(e.message);});
}
function errLoad(msg){document.getElementById('p0load').innerHTML='<div class="err">'+msg+'<button class="bp" style="margin-top:10px" onclick="cargar()">Reintentar</button></div>';sync('Error');}
function guardar(id,campo,val){sync('Guardando...');api('actualizarStock',{id:id,campo:campo,valor:val}).then(function(){sync('Sincronizado');});}
function rCams(){
  titulo('Stock Baterias');
  var h='<div class="grid">';
  CAMS.forEach(function(c){
    var t=datos.reduce(function(s,m){return s+(m[c.c]||0);},0);
    h+='<button class="card" onclick="vCam(\''+c.c+'\')"><div class="icon">&#128661;</div><div class="ci"><h2>Camioneta '+c.n+'</h2><p>'+t+' baterias en stock</p></div><span class="arr">&#8250;</span></button>';
  });
  h+='</div>';document.getElementById('l1').innerHTML=h;
}
function vCam(c){cam=CAMS.filter(function(x){return x.c===c;})[0];document.getElementById('p1').classList.add('hidden');document.getElementById('p2').classList.remove('hidden');titulo('Camioneta '+cam.n);rMarcas();}
function vC(){document.getElementById('p2').classList.add('hidden');document.getElementById('p1').classList.remove('hidden');rCams();}
function rMarcas(){
  var ms={};
  datos.forEach(function(m){var k=m.marca||'Sin marca';if(!ms[k])ms[k]={mod:0,uni:0};ms[k].mod++;ms[k].uni+=(m[cam.c]||0);});
  var h='<div class="grid">';
  Object.keys(ms).forEach(function(k){h+='<button class="card" onclick="vMarca(\''+k+'\')"><div class="ci"><h2>'+k+'</h2><p>'+ms[k].mod+' modelos</p></div><div class="mstat"><div class="mtot">'+ms[k].uni+'</div><div class="mlab">unidades</div></div><span class="arr">&#8250;</span></button>';});
  h+='</div>';document.getElementById('l2').innerHTML=h;
}
function vMarca(m){marca=m;document.getElementById('p2').classList.add('hidden');document.getElementById('p3').classList.remove('hidden');titulo(m);document.getElementById('bus').value='';rMod();}
function vM(){document.getElementById('p3').classList.add('hidden');document.getElementById('p2').classList.remove('hidden');titulo('Camioneta '+cam.n);}
function rMod(){
  var b=document.getElementById('bus').value.toLowerCase();
  var c=cam.c;
  var ms=datos.filter(function(m){return (m.marca||'Sin marca')===marca&&m.nombre.toLowerCase().indexOf(b)!==-1;});
  var el=document.getElementById('l3');
  if(!ms.length){el.innerHTML='<div class="loading">Sin resultados</div>';return;}
  var h='';
  ms.forEach(function(m){
    var s=m[c]||0;
    var esSSmod=(m.codigo&&(m.codigo.indexOf('EFB')!==-1||m.codigo.indexOf('72LD')!==-1));
    var badgeSSmod=esSSmod?'<span style="background:#dcfce7;color:#166534;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px">EFB (START STOP)</span>':'';
    h+='<div class="mc"><div class="mh"><div class="mn">'+m.nombre+badgeSSmod+'</div><span class="badge '+bc(s)+'">'+bl(s)+'</span></div>';
    h+='<div class="sr"><span class="sn">'+s+'</span><span class="sl">Baterias<br>Disponibles</span></div>';
    h+='<div class="acts"><button class="bp" onclick="abrirColocacion(\''+m.id+'\',\''+m.codigo+'\')"'+(s===0?' disabled':'')+'>- RESTAR UNA</button><button class="bs" onclick="tRep(\''+m.id+'\')">+ SUMAR UNA</button></div>';
    h+='<div class="rp" id="r'+m.id+'"><div style="font-size:13px;color:#888;margin-bottom:4px">Cuantas unidades agregas?</div>';
    h+='<div class="qr"><button class="qb" onclick="chQ(\''+m.id+'\',-1)">-</button><span class="qv" id="q'+m.id+'">1</span><button class="qb" onclick="chQ(\''+m.id+'\',1)">+</button></div>';
    h+='<div style="display:flex;gap:8px"><button class="bp" onclick="sumar(\''+m.id+'\')">Confirmar</button><button class="bs" onclick="tRep(\''+m.id+'\')">Cancelar</button></div></div></div>';
  });
  el.innerHTML=h;
}
function restar(id){var m=datos.filter(function(x){return x.id===id;})[0];if(!m||m[cam.c]===0)return;m[cam.c]--;guardar(id,cam.c,m[cam.c]);rMod();toast('- '+m.nombre+' quedan '+m[cam.c]);}
function tRep(id){var p=document.getElementById('r'+id);if(!p)return;var o=p.classList.contains('open');document.querySelectorAll('.rp.open').forEach(function(x){x.classList.remove('open');});if(!o){p.classList.add('open');qty[id]=1;document.getElementById('q'+id).textContent=1;}}
function chQ(id,d){qty[id]=Math.max(1,(qty[id]||1)+d);document.getElementById('q'+id).textContent=qty[id];}
function sumar(id){var m=datos.filter(function(x){return x.id===id;})[0];if(!m)return;var q=qty[id]||1;m[cam.c]+=q;guardar(id,cam.c,m[cam.c]);document.getElementById('r'+id).classList.remove('open');rMod();toast('+'+q+' '+m.nombre+' stock: '+m[cam.c]);}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function bc(s){return s===0?'out':s<=2?'low':'ok';}
function bl(s){return s===0?'AGOTADO - COMPRAR STOCK':s<=2?'COMPRAR STOCK':'Disponible';}

var colId=null,colPago='',colUbi='';
function abrirColocacion(id,codigo){
  colId=id;colPago='';colUbi='';
  document.getElementById('colVehiculo').value='';
  document.getElementById('colMotor').value='';
  document.getElementById('colCombustible').value='';
  document.getElementById('colPrecio').value='';
  document.querySelectorAll('#colPagoBtns .bs').forEach(function(b){b.style.background='transparent';b.style.color='#444';});
  document.querySelectorAll('#colUbiBtns .bs').forEach(function(b){b.style.background='transparent';b.style.color='#444';});
  document.getElementById('colOverlay').classList.remove('hidden');
}
function cerrarColOverlay(){document.getElementById('colOverlay').classList.add('hidden');}
function setColPago(v,btn){
  colPago=v;
  document.querySelectorAll('#colPagoBtns .bs').forEach(function(b){b.style.background='transparent';b.style.color='#444';});
  btn.style.background='#111';btn.style.color='#fff';
}
function setColUbi(v,btn){
  colUbi=v;
  document.querySelectorAll('#colUbiBtns .bs').forEach(function(b){b.style.background='transparent';b.style.color='#444';});
  btn.style.background='#111';btn.style.color='#fff';
}
function confirmarColocacion(){
  var m=datos.filter(function(x){return x.id===colId;})[0];
  if(!m){toast('Error: bateria no encontrada');return;}
  if(m[cam.c]===0){toast('Sin stock disponible');return;}
  var vehiculo=document.getElementById('colVehiculo').value.trim();
  if(!vehiculo){toast('Completa el vehiculo');return;}
  var nuevoStock=m[cam.c]-1;
  sync('Guardando...');
  api('registrarColocacion',{
    id:colId,campo:cam.c,valor:nuevoStock,
    vehiculo:vehiculo,
    motor:document.getElementById('colMotor').value.trim(),
    combustible:document.getElementById('colCombustible').value.trim(),
    modelo_bateria:m.codigo||m.nombre,
    precio:document.getElementById('colPrecio').value.trim(),
    forma_pago:colPago,
    ubicacion:colUbi,
    tecnico:cam.n
  }).then(function(r){
    if(r.ok){
      m[cam.c]=nuevoStock;
      sync('Sincronizado');
      cerrarColOverlay();
      rMod();
      toast('- '+m.nombre+' quedan '+m[cam.c]);
    }else{
      sync('Error');toast('Error al guardar');
    }
  }).catch(function(e){sync('Error');toast('Error: '+e.message);});
}
function mostrarResumen(){
  document.getElementById('p0').classList.add('hidden');
  document.getElementById('p7').classList.remove('hidden');
  titulo('Resumen');
  document.getElementById('historialBody').innerHTML='<tr><td colspan="10" class="loading">Cargando...</td></tr>';
  document.getElementById('resumenBody').innerHTML='<div class="loading">Cargando...</div>';
  api('getHistorial').then(function(r){
    if(!r.ok){document.getElementById('historialBody').innerHTML='<tr><td colspan="9" class="err">Error al cargar</td></tr>';return;}
          if(!r.data.length){document.getElementById('historialBody').innerHTML='<tr><td colspan="10" class="no-res">Sin servicios este mes</td></tr>';return;}
      var h='';
      r.data.forEach(function(s){
        var pagado=s.estado_pago==='Pagado';
        var rowStyle=pagado?'':' style="font-weight:700"';
        var bg=pagado?'#dcfce7':'#fee2e2';
        var col=pagado?'#166534':'#991b1b';
        var label=pagado?'PAGADO':'NO PAGADO';
        var idr=s.id_registro||'';
        h+='<tr'+rowStyle+'><td>'+s.fecha+'</td><td>'+s.vehiculo+'</td><td>'+s.motor+'</td><td>'+s.combustible+'</td><td>'+s.modelo_bateria+'</td><td>$'+s.precio+'</td><td>'+s.forma_pago+'</td><td>'+s.ubicacion+'</td><td>'+s.tecnico+'</td><td><button style="background:'+bg+';color:'+col+';border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer" onclick="togglePago(\''+idr+'\',\''+s.estado_pago+'\',this)"'+(idr?'':' disabled title="Registro viejo sin ID"')+'>'+label+'</button></td></tr>';
      });
      document.getElementById('historialBody').innerHTML=h;
    }).catch(function(e){document.getElementById('historialBody').innerHTML='<tr><td colspan="10" class="err">Error: '+e.message+'</td></tr>';});
  api('getResumen').then(function(r){
    if(!r.ok){document.getElementById('resumenBody').innerHTML='<div class="err">Error al cargar</div>';return;}
    var h='';
    h+='<div style="display:flex;gap:12px;margin-bottom:16px">';
    h+='<div class="mc" style="flex:1;text-align:center"><div style="font-size:13px;color:#888;margin-bottom:6px">HOY</div><div style="font-size:36px;font-weight:700">'+r.hoy+'</div><div style="font-size:12px;color:#888">servicios</div></div>';
    h+='<div class="mc" style="flex:1;text-align:center"><div style="font-size:13px;color:#888;margin-bottom:6px">ULTIMOS 7 DIAS</div><div style="font-size:36px;font-weight:700">'+r.semana+'</div><div style="font-size:12px;color:#888">servicios</div></div>';
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por tecnico (7 dias)</div>';
    Object.keys(r.porTecnico).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porTecnico[k]+'</span></div>';});
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por marca (7 dias)</div>';
    Object.keys(r.porMarca).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porMarca[k]+'</span></div>';});
    h+='</div>';
    h+='<div class="mc"><div style="font-weight:700;margin-bottom:10px">Por forma de pago (7 dias)</div>';
    Object.keys(r.porPago).forEach(function(k){h+='<div class="gcard-row">'+k+': <span>'+r.porPago[k]+'</span></div>';});
    h+='</div>';
    document.getElementById('resumenBody').innerHTML=h;
  }).catch(function(e){document.getElementById('resumenBody').innerHTML='<div class="err">Error: '+e.message+'</div>';});
}
cargar();
</script>
